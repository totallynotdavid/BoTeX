# .golangci.toml
version = "2"

[linters]
  default = "all"
  disable = [
    "lll",
    "dupl",
    "funlen",
    "nestif",
    "wsl",
    "gochecknoinits",
    "exhaustruct",
    "exhaustruct_v5",
    "nonamedreturns",
    "gomodguard",
  ]

  [linters.settings]
    [linters.settings.goconst]
      ignore-string-values = ["^(error|sender|command|level)$"]

    [linters.settings.gocritic]
      enabled-tags = ["performance", "style", "experimental"]
      disabled-checks = ["hugeParam"]

    [linters.settings.gocyclo]
      min-complexity = 15  # Default is 30 (we are more strict)

    [linters.settings.gocognit]
      min-complexity = 15  # Default is 30 (we are more strict)

    [linters.settings.prealloc]
      simple = true
      range-loops = true

    [linters.settings.errcheck]
      check-type-assertions = true
      check-blank = true

    [linters.settings.depguard.rules.whatsmeow]
      files = ["**/internal/**", "!**/internal/whatsapp/*.go"]
      deny = [
        { pkg = "go.mau.fi/whatsmeow", desc = "only internal/whatsapp talks to WhatsApp; use the bot package types" }
      ]

    [linters.settings.revive]
      rules = [
        { name = "exported", disabled = true }
      ]

  # A flow file is written by hand in snake_case; the rest of the module keeps
  # tagliatelle's camelCase default.
  [linters.exclusions]
    [[linters.exclusions.rules]]
      path = "internal/flow/fsm/flow.go"
      linters = ["tagliatelle"]

[formatters]
  enable = ["gofumpt", "goimports", "gci"]
  [formatters.settings.gofumpt]
    module-path = "github.com/totallynotdavid/botkit"
  [formatters.settings.gci]
    sections = ["standard", "default", "prefix(github.com/totallynotdavid/botkit)"]

[run]
  timeout = "5m"
  concurrency = 4
  tests = true
  modules-download-mode = "readonly"
  allow-parallel-runners = true

[issues]
  max-issues-per-linter = 0
  max-same-issues = 0
  fix = false

[severity]
  default = "error"
