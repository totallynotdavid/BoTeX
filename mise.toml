[tools]
go = "1.27.1"
golangci-lint = "2.14.0"

[tasks.install]
description = "Install Go dependencies"
run = ["go mod download", "go mod tidy"]

[tasks.dev]
description = "Start the app locally"
run = "go run ."

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.build]
description = "Build the application"
run = "go build"

[tasks.lint]
description = "Format and lint the code"
run = [
  "golangci-lint config verify",
  "golangci-lint fmt",
  "golangci-lint run --fix",
]

[tasks."test:render"]
description = "Run the full test suite, including the render-bound tests, inside a disposable image with the real TeX Live/ImageMagick/prlimit toolchain"
run = """
docker build -f docker/render-test.Dockerfile -t botex-render-test .
docker run --rm -v "$PWD":/src -w /src botex-render-test \
  bash -c 'go build ./... && go vet ./... && go test ./... -v'
"""

